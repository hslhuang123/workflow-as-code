[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-as-code"
version = "0.1.0"
description = "Local workflow-as-code MVP with YAML authoring and JSON IR"
readme = "docs/MVP.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wf = "wf.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
